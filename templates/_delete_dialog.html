<dialog id="delete-dialog" aria-labelledby="delete-title"><h2 id="delete-title">Elimina elemento</h2><p id="delete-description"></p><label class="check-label" id="delete-extra"><input type="checkbox" id="delete-related"> Elimina anche le catture associate</label><div class="message" id="delete-error" role="alert"></div><div class="actions"><button id="delete-cancel" type="button" autofocus>Annulla</button><button id="delete-confirm" class="danger" type="button">Elimina</button></div></dialog>
<script>
let pendingDelete=null;
function askDelete(url,title,description,related=false){const d=document.getElementById('delete-dialog');pendingDelete={url,related};document.getElementById('delete-title').textContent=title;document.getElementById('delete-description').textContent=description;document.getElementById('delete-extra').hidden=!related;document.getElementById('delete-related').checked=false;document.getElementById('delete-error').className='message';d.showModal()}
document.getElementById('delete-cancel').onclick=()=>document.getElementById('delete-dialog').close();
document.getElementById('delete-confirm').onclick=async function(){if(!pendingDelete)return;this.disabled=true;document.getElementById('delete-cancel').disabled=true;try{await postJSON(pendingDelete.url,{delete_captures:pendingDelete.related&&document.getElementById('delete-related').checked});location.reload()}catch(e){const m=document.getElementById('delete-error');m.textContent=e.message;m.className='message err'}finally{this.disabled=false;document.getElementById('delete-cancel').disabled=false}};
async function postJSON(url,body){let r;try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw new Error('Server non raggiungibile. Riprova tra poco.')}let j;try{j=await r.json()}catch(e){throw new Error('Risposta del server non valida. Ricarica la pagina e riprova.')}if(!r.ok||!j.ok)throw new Error(j.error||'Operazione non riuscita. Riprova.');return j}
</script>
