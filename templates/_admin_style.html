<style>
:root{color-scheme:dark;--bg:#0e0f13;--console-width:1248px;--console-gutter:32px;--console-surface:#16171e;--console-line:#2c2e38;--card:#151419;--raised:#1e1c24;--border:#302d38;--accent:#ba9aff;--action:#8050d6;--txt:#f1eef7;--dim:#aaa4b5;--ok:#8dd5b0;--err:#ff9ca6;--mono:Consolas,"Cascadia Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 "Segoe UI",system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit}
button,a.btn{cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
button,a.btn{transition:background .16s,border-color .16s;color:var(--txt);background:var(--raised);border:1px solid var(--border);border-radius:8px;min-height:40px;padding:8px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:14px;font-weight:500}
button:hover,a.btn:hover{background:#2a2533;border-color:#595064}
button.primary,a.primary{background:var(--action);border-color:var(--action);color:#fff}
button.primary:hover,a.primary:hover{background:#9362e5}
button.danger{background:transparent;color:var(--err)}
button.danger:hover{background:#341d25;border-color:#8c4452}
button.quiet{border-color:transparent;background:transparent;padding:4px 8px;min-height:36px}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
input:not([type=checkbox]),select,textarea{width:100%;background:#100f14;color:var(--txt);border:1px solid #494251;border-radius:8px;padding:12px;min-height:44px;outline:none}
input::placeholder,textarea::placeholder{color:#898292}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:96px}
input[type=checkbox]{accent-color:var(--action);width:18px;height:18px}
label{display:block;font-size:14px;margin:0 0 8px;font-weight:500}
label small{font-weight:400;color:var(--dim)}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(32px,4vw,40px);line-height:1.1;font-weight:600;letter-spacing:-.8px}
h2{font-size:20px;font-weight:500}
h3{font-size:16px;font-weight:500}
.muted,.hint,.sub,.geo{color:var(--dim)}
.hint,.geo{font-size:13px}
.sub{margin-top:8px;max-width:65ch}
.mono,.ip{font-family:var(--mono);font-variant-numeric:tabular-nums}
.brand{display:flex;gap:8px;align-items:center;color:var(--txt);font-size:17px;font-weight:600}
.brand:hover{text-decoration:none}
.brand img{display:block;flex:none}
.topbar{border-bottom:1px solid var(--console-line);background:#121319}
.topbar nav{display:flex;align-items:center;gap:4px;min-width:0}
.topbar nav a{position:relative;color:var(--dim);padding:8px 16px;border-radius:6px;font-size:14px}
.topbar nav a[aria-current=page]{background:#21212b;color:var(--txt)}
.topbar nav a:hover{color:var(--txt);background:#21212b;text-decoration:none}
.wrap{width:min(100%,var(--console-width));margin-inline:auto;padding:36px var(--console-gutter) 64px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:32px}
.page-meta{font-family:var(--mono);font-size:13px;color:var(--dim);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.panel,.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px}
.section-head{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.field{min-width:0}
.field .hint{margin-top:8px}
.actions,.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form-actions{margin-top:24px}
.message,.msg{display:none;font-size:14px;margin-top:16px;padding:12px 16px;border-radius:8px;border:1px solid var(--border)}
.message.ok,.msg.ok{display:block;color:var(--ok);background:#16241f}
.message.err,.msg.err{display:block;color:var(--err);background:#291a21}
.result{display:none;margin-top:24px;padding:20px;border:1px solid #5a4279;background:#1d1729;border-radius:8px}
.result .link{font-family:var(--mono);font-size:15px;overflow-wrap:anywhere;margin:8px 0 16px}
.list-shell{border-block:1px solid var(--console-line)}
.link-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) auto;gap:24px;padding:20px 12px;align-items:center}
.row-title{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.row-note{font-size:13px;color:var(--dim);margin-top:4px;overflow-wrap:anywhere}
.row-url{color:var(--txt);font-size:13px;overflow-wrap:anywhere}
.row-meta{display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--dim)}
.row-actions{justify-content:flex-end;gap:4px}
.row-actions a{display:inline-flex;align-items:center;min-height:36px;font-size:13px;padding:4px 8px;white-space:nowrap}
.empty{padding:40px 16px;text-align:center;color:var(--dim)}
.empty h3{color:var(--txt);margin-bottom:8px}
.connection{display:grid;grid-template-columns:1.2fr 1fr;gap:32px}
.connection .address{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere;margin-top:12px;color:var(--txt)}
.inline-input{display:flex;gap:8px;align-items:flex-start}
.notice{font-size:13px;color:var(--dim);margin-top:16px}
.footer{font-size:13px;color:var(--dim);margin-top:32px;border-top:1px solid var(--console-line);padding-top:16px;display:flex;justify-content:space-between;gap:16px}
.summary-line{display:flex;gap:24px;margin-top:16px;color:var(--dim);font-size:13px}
.summary-line b{color:var(--txt);font-family:var(--mono);font-size:18px;font-weight:400;margin-right:8px;font-variant-numeric:tabular-nums}
.capture-list{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.capture{background:var(--console-surface);border:1px solid var(--console-line);border-radius:12px;overflow:hidden}
.capture-head{display:flex;gap:16px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--console-line);padding:16px 24px}
.capture-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:20px 24px}
.capture-grid h3{margin-bottom:8px;color:var(--dim);font-size:13px}
.capture-grid p{overflow-wrap:anywhere}
.capture .ip{font-size:18px;line-height:1.35}
.capture details{border-top:1px solid var(--console-line);padding:12px 24px}
summary{cursor:pointer;color:var(--accent);font-size:14px}
pre{font:12px/1.6 var(--mono);color:var(--dim);white-space:pre-wrap;overflow-wrap:anywhere;background:#100f14;padding:16px;border-radius:8px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:16px;overflow-wrap:anywhere}
.check{font-size:12px;color:var(--dim);padding-top:8px}
.tag{color:var(--dim);font-size:12px}
.toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:16px;padding:12px 20px;border:1px solid var(--console-line);border-radius:8px;background:var(--console-surface)}
.toolbar select{min-width:220px}
.search-count{font-size:13px;color:var(--dim);margin-top:8px}
dialog{color:var(--txt);background:var(--card);border:1px solid #51475f;border-radius:16px;width:min(480px,calc(100% - 32px));padding:28px}
dialog::backdrop{background:#000a}
dialog h2{margin-bottom:12px}
dialog p{color:var(--dim);overflow-wrap:anywhere}
dialog .actions{justify-content:flex-end;margin-top:24px}
.check-label{display:flex;align-items:center;gap:12px;font-size:14px;margin-top:20px}
dialog .message{margin-top:16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

.topbar-inner{
    width:min(100%,var(--console-width));
    margin-inline:auto;
    padding:12px var(--console-gutter);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px
}
.topbar nav a[aria-current=page]::after{
    content:"";
    position:absolute;
    inset:auto 12px 0;
    height:2px;
    background:var(--accent)
}
.skip-link:focus{
    position:fixed;
    inset:12px auto auto 12px;
    width:auto;
    height:auto;
    margin:0;
    padding:8px 12px;
    clip:auto;
    z-index:1;
    background:var(--console-surface)
}
.page-head>div,.row-identity,.row-destination,.capture-head>div{min-width:0}
.link-register{margin-block:32px}
.link-register .section-head{margin-bottom:12px}
.link-register .section-head a{font-size:14px}
.link-row+.link-row{border-top:1px solid var(--console-line)}
.link-row:focus-within{background:var(--console-surface)}
.row-time,.row-counts{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row-time{color:var(--dim);font-size:12px;overflow-wrap:anywhere}
.row-destination .row-time{margin-top:4px}
.row-actions a.btn{min-height:36px}
.row-actions button{font-size:13px;white-space:nowrap}
.capture-head h2{font-size:17px;overflow-wrap:anywhere}
.capture-meta{
    display:flex;
    flex-wrap:wrap;
    gap:4px 12px;
    margin-top:4px;
    font-size:13px;
    color:var(--dim);
    overflow-wrap:anywhere
}
.capture-grid>section+section{border-inline-start:1px solid var(--console-line);padding-inline-start:20px}
.capture summary:hover{color:var(--txt)}
.capture details[open]{padding-bottom:20px}

@media(max-width:1000px){
    .link-row{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}
    .row-actions{grid-column:1/-1;justify-content:flex-start}
}
@media(max-width:760px){
    :root{--console-gutter:24px}
    .capture-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .capture-grid>:last-child{
        grid-column:1/-1;
        border-inline-start:0;
        border-top:1px solid var(--console-line);
        padding:16px 0 0
    }
}
@media(max-width:640px){
    :root{--console-gutter:16px}
    .topbar-inner{gap:4px;align-items:flex-start;flex-direction:column}
    .topbar nav{width:100%;padding-top:4px}
    .topbar nav a{flex:1;text-align:center}
    .brand{font-size:16px}
    .brand img{width:36px;height:36px}
    .wrap{padding-top:28px;padding-bottom:40px}
    h1{font-size:30px}
    .page-head{align-items:flex-start;flex-direction:column;gap:12px;margin-bottom:24px}
    .panel,.card{padding:20px}
    .form-grid,.connection,.capture-grid,.detail-grid{grid-template-columns:minmax(0,1fr)}
    .link-register{margin-block:24px}
    .link-row{grid-template-columns:minmax(0,1fr);gap:12px;padding:16px 4px}
    .row-actions{grid-column:auto}
    .toolbar{align-items:stretch;flex-direction:column;gap:12px;padding:12px}
    .toolbar select{min-width:0}
    .capture-head,.capture-grid,.capture details{padding-inline:16px}
    .capture-head{gap:12px;flex-wrap:wrap}
    .capture-grid>section+section{
        grid-column:auto;
        border-inline-start:0;
        border-top:1px solid var(--console-line);
        padding:12px 0 0
    }
    .inline-input{flex-direction:column}
    .inline-input button{width:100%}
    .footer{flex-direction:column}
    .summary-line{gap:20px}
    .section-head{align-items:flex-start;gap:12px}
    .page-meta{font-size:12px}
}
@media(max-width:480px){
    .row-actions{
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr))
    }
    .row-actions a,.row-actions a.btn,.row-actions button{
        min-height:44px;
        justify-content:center
    }
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
